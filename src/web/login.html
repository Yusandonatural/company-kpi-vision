    <script type="application/ld+json">

          {

          },

        ]

    <script>
      window.GOOGLE_IDS = { site_url: 'https://kpi.yusando.com', ga4_measurement_id: '', ads_conversion_id: '', ads_conversion_labels: {} };
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted' });
      // 本番ドメイン以外では送信しない
      window.__GTAG_ENABLED = !!GOOGLE_IDS.ga4_measurement_id && location.hostname === new URL(GOOGLE_IDS.site_url).hostname;
      if (window.__GTAG_ENABLED) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GOOGLE_IDS.ga4_measurement_id;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', GOOGLE_IDS.ga4_measurement_id, { send_page_view: true });
      }
      window.trackConversion = function (name, params) {
        params = Object.assign({ site: 'yusando-kpi' }, params || {});
        if (!window.__GTAG_ENABLED) return console.debug('[gtag disabled]', name, params);
        gtag('event', name, params);
      };
    </script>
    <!-- ===== Google 標準セット ここまで ===== -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #f0f2f5; --surface: #fff; --ink: #0f1419; --muted: #65676b; --line: #e4e6eb; --accent: #1877f2; --warn: #e0245e; --ig: linear-gradient(45deg, #feda75, #fa7e1e 25%, #d62976 50%, #962fbf 75%, #4f5bd5); color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --bg: #18191a; --surface: #242526; --ink: #e4e6eb; --muted: #b0b3b8; --line: #3e4042; --accent: #2d88ff; --warn: #ff5c8a; color-scheme: dark; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: 'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; padding: 16px; }
      main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 40px 32px 28px; text-align: center; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
      .mark { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; }
      h1 { font-weight: 700; font-size: 30px; margin: 0 0 6px; letter-spacing: .01em; }
      h1 b { background: var(--ig); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { color: var(--muted); line-height: 1.8; margin: 0 0 26px; font-size: 15px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; }
      .btn:hover { filter: brightness(1.06); }
      .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .error { color: var(--warn); font-size: 14px; margin: 0 0 16px; min-height: 1em; }
      .dev[hidden] { display: none; }
      .dev { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
      footer { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon.svg" alt="" width="56" height="56" />
      <h1>悠三堂 <b>KPI</b></h1>
      <p>ビジョンから今日の行動まで。<br />チームの「できた」が集まる場所。</p>
      <p class="error" id="error" role="alert"></p>
      <a class="btn" id="login" href="/auth/google">会社のGoogleアカウントでログイン</a>
      <a class="dev" id="dev" href="/auth/dev" hidden>開発用ログイン（ローカルのみ）</a>
      <footer>株式会社悠三堂</footer>
    </main>
    <script>
      var messages = {
        forbidden: '会社のGoogleアカウント（@yusando.com）でログインしてください。',
        denied: 'Googleでのログインがキャンセルされました。',
        state: 'ログインの有効期限が切れました。もう一度お試しください。',
        token: 'Googleとの連携に失敗しました。もう一度お試しください。',
      };
      var err = new URLSearchParams(location.search).get('error');
      if (err) document.getElementById('error').textContent = messages[err] || 'ログインできませんでした。';
      document.getElementById('login').addEventListener('click', function () {
        window.trackConversion('login', { method: 'Google' });
      });
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') document.getElementById('dev').hidden = false;
    </script>
  </body>
</html>
